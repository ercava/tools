<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEGASUS Support</title>
  <link rel="icon" type="image/x-icon" href="https://erc.my.id/tools/logo/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading -->
  <div id="loading-screen" class="screen active">
    <div style="text-align: center;">
      <h1 class="brand-name" style="font-size: 2rem;">PEGASUS <small>Support</small></h1>
      <p class="desc" style="color: var(--muted); margin: 0.5rem 0 1.5rem;">Memuat antrian...</p>
      <div class="loader"></div>
    </div>
  </div>

  <!-- Main -->
  <div id="main-screen" class="screen">
    <div class="page-wrap">

      <!-- Now Serving + Lookup (merged) -->
      <div class="card now-serving">
        <div class="label">QUEUE</div>
        <div class="big-number" id="now-serving-number">—</div>
        <div class="serving-name" id="now-serving-name">&nbsp;</div>
        <div class="waiting-row" id="waiting-chips"></div>

        <div class="lookup-inner">
          <hr class="divider">
          <h3>Sabar yah! Orderan kamu bakal diproses kok!</h3>
          <div class="input-group">
            <label for="lookup-name" class="input-label">Nama</label>
            <input type="text" id="lookup-name" class="input-field" placeholder="Masukkan nama kamu" autocomplete="off">
          </div>
          <button id="lookup-btn" class="btn">Cek</button>
          <div id="lookup-error" class="error-msg">Nama tidak ditemukan dalam antrian.</div>
        </div>
      </div>

      <!-- Result -->
      <div id="result-container"></div>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="public.js"></script>
</body>
</html>
