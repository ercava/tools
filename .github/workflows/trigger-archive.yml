name: Trigger Main Site Archive

on:
  push:
    branches:
      - main
      - master

jobs:
  notify-main-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository_dispatch in main site repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          repository: ercava/ercava.github.io
          event-type: tools_updated
